<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phrase Search</title>
<style>
/* 落ち着いた配色・強調は一致箇所だけ・レイアウトを動かさない（web/ の React 版と同じデザイン） */
:root {
  --font: "BIZ UDPGothic";
  --font-size: 18px;
  --bg: #f7f7f5;
  --surface: #ffffff;
  --text: #1c1c1e;
  --muted: #7b7b80;
  --ctx: #8e8e93;
  --faint: #c2c2c6;
  --border: #e4e4e0;
  --accent: #3554c8;
  --accent-soft: #eef1fd;
  --hit: #d70015;
  --mark0: #ffe9a3;
  --mark1: #cfe6ff;
  --active: #f3f5ff;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.06);
  --warn: #fff4d6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --surface: #1c1c1f; --text: #ececef; --muted: #94949b; --ctx: #85858c;
    --faint: #4a4a50; --border: #2d2d32; --accent: #8ea2ff; --accent-soft: #23284a;
    --hit: #ff6961; --mark0: rgba(255, 204, 0, 0.3); --mark1: rgba(90, 160, 255, 0.32); --active: #22243a;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5); --warn: #3a3320; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1c1c1f; --text: #ececef; --muted: #94949b; --ctx: #85858c;
  --faint: #4a4a50; --border: #2d2d32; --accent: #8ea2ff; --accent-soft: #23284a;
  --hit: #ff6961; --mark0: rgba(255, 204, 0, 0.3); --mark1: rgba(90, 160, 255, 0.32); --active: #22243a;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.5); --warn: #3a3320; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font), "Hiragino Sans", "Yu Gothic", Meiryo, system-ui, sans-serif;
  font-size: var(--font-size);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
kbd {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.72em;
  padding: 0.05em 0.45em;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 5px;
  color: var(--muted);
  background: var(--surface);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
[hidden], .hidden { display: none !important; }

.app { display: flex; flex-direction: column; height: 100%; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.error { color: #c62828; }
.link { color: var(--accent); font-size: 0.85em; }
.link:hover { text-decoration: underline; }

/* ---- 上部バー（主張しない） ---- */
.topbar { display: flex; align-items: center; gap: 0.9rem; padding: 0.55rem 1.25rem; font-size: 0.8em; color: var(--muted); }
.brand { font-weight: 700; color: var(--text); letter-spacing: 0.01em; }
.data-label { min-width: 0; max-width: 50vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .link, .brand { white-space: nowrap; flex: none; }

.main { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 1.25rem; }

/* ---- 検索欄（画面の主役） ---- */
.search { padding-top: 0.75rem; }
.search-row {
  display: flex; align-items: center; gap: 0.6rem;
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
  padding: 0 0.9rem; height: 3.4em; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); transition: border-color 0.12s;
}
.search-row:focus-within { border-color: var(--accent); }
.search-icon { color: var(--muted); flex: none; }
.search-input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 1.3em; height: 100%; }
.search-input::placeholder { color: var(--faint); }
.kbd-hint { flex: none; }
.search-row:focus-within .kbd-hint { visibility: hidden; }

.icon-btn { display: inline-grid; place-items: center; width: 1.9em; height: 1.9em; border-radius: 8px; color: var(--muted); flex: none; font-size: 0.95em; }
.icon-btn:hover { background: var(--accent-soft); color: var(--text); }
.icon-btn.faint { color: var(--faint); }

.sub-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.5rem;
  padding: 0.35rem 0.5rem 0.35rem 0.9rem; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; font-size: 0.9em;
}
.sub-row:focus-within { border-color: var(--accent); }
.sub-label { color: var(--muted); white-space: nowrap; font-size: 0.9em; }
.sub-input { flex: 1; min-width: 8em; border: 0; outline: 0; background: transparent; padding: 0.25rem 0; }
.sub-help { color: var(--muted); font-size: 0.8em; }

.segmented { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px; font-size: 0.85em; }
.segmented button { padding: 0.2rem 0.7rem; border-radius: 6px; color: var(--muted); white-space: nowrap; }
.segmented button.on { background: var(--surface); color: var(--text); font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.segmented.small { font-size: 0.9em; }

/* ---- 絞り込み（いつも見える。有効なものは色が付く） ---- */
.chip-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-top: 0.7rem; font-size: 0.82em; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); white-space: nowrap; }
.chip.ghost, .chip.link { padding: 0.18rem 0.75rem; }
.chip.ghost { border-style: dashed; }
.chip.ghost:hover { color: var(--text); border-color: var(--muted); }
.chip.link { border: 0; background: none; color: var(--accent); }
.chip-main { padding: 0.18rem 0.75rem; display: inline-flex; gap: 0.25rem; align-items: center; }
.chip:hover { border-color: var(--muted); }
.chip.active { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.active .chip-main { padding-right: 0.25rem; }
.chip-x { padding: 0 0.6rem 0 0.2rem; opacity: 0.7; }
.chip-x:hover { opacity: 1; }
.caret { font-size: 0.75em; opacity: 0.6; }
.divider { width: 1px; height: 1.2em; background: var(--border); margin: 0 0.2rem; }

.pop-anchor { position: relative; }
.popover {
  position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; min-width: 14rem; max-width: 22rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow); padding: 0.5rem; font-size: 0.95rem; color: var(--text);
}
.popover.right { left: auto; right: 0; }
.pop-find { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 0.3rem 0.55rem; background: var(--bg); margin-bottom: 0.35rem; outline: 0; }
.pop-list { max-height: 18rem; overflow: auto; }
.pop-item { display: flex; align-items: center; gap: 0.55rem; padding: 0.3rem 0.45rem; border-radius: 6px; cursor: pointer; }
.pop-item:hover { background: var(--bg); }
.pop-item input { accent-color: var(--accent); width: 1rem; height: 1rem; }
.pop-foot { display: flex; justify-content: space-between; padding: 0.4rem 0.35rem 0.1rem; border-top: 1px solid var(--border); margin-top: 0.35rem; }

.year-pop { min-width: 17rem; }
.year-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.2rem 0.2rem 0.5rem; }
.year-row select { flex: 1; padding: 0.25rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
.year-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
.year-grid button { padding: 0.25rem 0; border-radius: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
.year-grid button.in { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.year-grid button:hover { outline: 1px solid var(--border); }

.settings { display: grid; gap: 0.8rem; padding: 0.8rem; min-width: 16rem; }
.settings label { display: grid; gap: 0.3rem; font-size: 0.88rem; color: var(--muted); }
.settings label b { color: var(--text); }
.settings input[type="range"] { accent-color: var(--accent); }
.settings select { padding: 0.3rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }

/* ---- 件数の行（高さ固定でガタつかない） ---- */
.status {
  display: flex; align-items: baseline; gap: 0.35rem; min-height: 2.6em;
  padding: 0.9rem 0.2rem 0.4rem; border-bottom: 1px solid var(--border); font-size: 0.9em;
}
.status .big { font-size: 1.35em; }
.status .pill { margin-left: 0.5rem; font-size: 0.8em; padding: 0.05rem 0.55rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.status .hint { font-size: 0.78em; color: var(--muted); display: inline-flex; gap: 0.35rem; align-items: center; }
.file-list { display: flex; flex-wrap: wrap; gap: 0.35rem 0.9rem; margin: 0.6rem 0 0; font-size: 0.85em; color: var(--muted); }
.file-list .file { display: inline-flex; align-items: center; gap: 0.3rem; }
.file-list .file b { color: var(--text); font-weight: 600; }
.file-list .icon-btn { padding: 0 0.25rem; }
.notice { margin: 0.6rem 0 0; padding: 0.5rem 0.8rem; border-radius: 8px; background: var(--warn); font-size: 0.85em; }
.notice.err { background: rgba(198, 40, 40, 0.12); color: #c62828; }

/* ---- 結果（見えている行だけを描画する） ---- */
.results { flex: 1; min-height: 0; overflow-y: auto; outline: 0; margin: 0 -0.6rem; padding: 0 0.6rem 3rem; }
.sizer { position: relative; }
.card {
  position: absolute; top: 0; left: 0; width: 100%; padding: 0.75rem 0.9rem 0.8rem;
  border-bottom: 1px solid var(--border); border-left: 3px solid transparent; cursor: pointer;
}
.card:hover { background: var(--surface); }
.card.active { background: var(--active); border-left-color: var(--accent); }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15rem 0.6rem; font-size: 0.78em; color: var(--muted); margin-bottom: 0.2rem; }
.issuer { color: var(--text); font-weight: 700; font-size: 1.08em; }
.rating { font-variant-numeric: tabular-nums; color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 0 0.4rem; font-size: 0.95em; }
.rating.up { border-color: #2e7d32; color: #2e7d32; }
.rating.down { border-color: #c62828; color: #c62828; }
.snippet { margin: 0; line-height: 1.75; word-break: break-word; }
.snippet .ctx { color: var(--text); }
.snippet.full { margin-top: 0.4rem; padding: 0.6rem 0.85rem; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); }
mark { color: var(--hit); background: transparent; font-weight: 700; border-radius: 3px; padding: 0 1px; }
/* 2語目は赤字のまま、薄い下地で語を見分ける */
mark.t1 { background: var(--mark1); }

/* ---- 読み込み・最近の検索・空の状態 ---- */
.dropzone {
  margin: 1.2rem 0; padding: 3rem 1rem; text-align: center; border: 2px dashed var(--border);
  border-radius: 14px; color: var(--muted); cursor: pointer;
}
.dropzone:hover, .dropzone.over { border-color: var(--accent); color: var(--text); }
.dropzone b { color: var(--text); }
.dropzone p { margin: 0.3rem 0; }
progress { width: 100%; height: 0.4rem; margin-top: 0.4rem; accent-color: var(--accent); }
.empty { padding: 3rem 0.5rem; text-align: center; }
.empty p { margin: 0.3rem 0; }
.recent { padding: 1.2rem 0.2rem; overflow-y: auto; }
.recent-head { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 0.85em; margin-bottom: 0.4rem; }
.recent ul { list-style: none; padding: 0; margin: 0; }
.recent li { display: flex; align-items: center; border-radius: 10px; }
.recent li:hover { background: var(--surface); }
.recent-item { flex: 1; display: flex; justify-content: space-between; gap: 1rem; text-align: left; padding: 0.5rem 0.7rem; }
.recent-q { font-weight: 700; }
.recent-meta { color: var(--muted); font-size: 0.8em; white-space: nowrap; }

/* ---- ブラウザ内の共起語探索 ---- */
.main.analysis-view { max-width: 1440px; }
.view-tabs { display: flex; gap: 1rem; border-bottom: 1px solid var(--border); margin-top: 0.4rem; }
.view-tabs button { padding: 0.5rem 0.3rem; color: var(--muted); border-bottom: 2px solid transparent; }
.view-tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.terms-panel { flex: 1; min-height: 0; overflow: auto; padding: 0.8rem 0 2rem; }
.term-controls, .term-trail, .term-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
.term-controls { font-size: 0.82em; margin-bottom: 0.6rem; }
.term-controls label { display: flex; align-items: center; gap: 0.35rem; }
.term-controls select, .term-controls input { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.2rem 0.4rem; }
.term-controls input { width: 4.5em; }
.term-trail .chip { padding: 0.2rem 0.65rem; white-space: normal; text-align: left; overflow-wrap: anywhere; }
.term-caption { font-size: 0.82em; color: var(--muted); margin: 0.5rem 0; }
.term-split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; align-items: start; }
.term-split.has-context { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); }
.term-table-wrap { overflow: auto; max-height: 65vh; }
.term-table { border-collapse: collapse; width: 100%; font-size: 0.83em; }
.term-table th, .term-table td { padding: 0.4rem 0.55rem; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; font-variant-numeric: tabular-nums; }
.term-table th { position: sticky; top: 0; background: var(--surface); }
.term-table th:first-child, .term-table td:first-child { text-align: left; }
.term-table button { color: var(--accent); font-weight: 700; text-align: left; }
.term-table tr.selected { background: var(--accent-soft); }
.term-context { border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem; background: var(--surface); min-width: 0; }
.term-context header { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.term-actions { margin: 0.6rem 0; font-size: 0.82em; }
.term-actions .chip { padding: 0.25rem 0.65rem; white-space: normal; }
.term-examples { overflow: auto; max-height: 50vh; }
.term-example { border-top: 1px solid var(--border); padding: 0.6rem 0; font-size: 0.9em; }
.term-example summary { cursor: pointer; }
@media (max-width: 900px) { .term-split.has-context { grid-template-columns: minmax(0, 1fr); } }

@media (max-width: 640px) {
  .main, .topbar { padding-left: 1rem; padding-right: 1rem; }
  .status .hint, .kbd-hint, .sub-help { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand">Phrase Search</span>
    <span class="data-label" id="dataLabel"></span>
    <button class="link hidden" id="addBtn" title="今のデータに、別のファイルの行を加えます">＋ ファイルを追加</button>
    <button class="link" id="openBtn">ファイルを開く</button>
    <span class="spacer"></span>
    <div class="pop-anchor" id="settingsAnchor">
      <button class="icon-btn" id="settingsBtn" aria-label="表示設定" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </button>
      <div class="popover right settings" id="settingsPop" hidden>
        <label>文字サイズ <b class="num" id="fontSizeVal"></b>
          <input type="range" id="fontSize" min="14" max="28">
        </label>
        <label>前後の表示文字数 <b class="num" id="contextVal"></b>
          <input type="range" id="context" min="10" max="120" step="5">
        </label>
        <label>フォント
          <select id="fontSel"></select>
        </label>
        <div class="segmented small" role="radiogroup" aria-label="テーマ" id="themeSeg">
          <button data-theme="auto">自動</button>
          <button data-theme="light">ライト</button>
          <button data-theme="dark">ダーク</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="search hidden" id="searchBox">
      <div class="search-row">
        <svg class="search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search-input" id="q" placeholder="フレーズを入力（完全一致）" aria-label="検索フレーズ" spellcheck="false" autocomplete="off">
        <button class="icon-btn hidden" id="clearQ" aria-label="クリア">×</button>
        <kbd class="kbd-hint">/</kbd>
      </div>

      <div class="sub-row hidden" id="secondRow">
        <span class="sub-label">＋ 2つ目の語</span>
        <input class="sub-input" id="q2" placeholder="例: 改善" spellcheck="false" autocomplete="off">
        <div class="segmented" role="radiogroup" aria-label="2語の条件" id="modeSeg"></div>
        <button class="icon-btn" id="removeSecond" aria-label="2つ目の語を外す">×</button>
      </div>

      <div class="sub-row hidden" id="exclRow">
        <span class="sub-label">− 除外</span>
        <input class="sub-input" id="excl" placeholder="例: 比較的強固（スペース区切りで複数）" spellcheck="false" autocomplete="off">
        <span class="sub-help">この語の中の一致は数えません</span>
        <button class="icon-btn" id="removeExcl" aria-label="除外を外す">×</button>
      </div>

      <div class="chip-row">
        <button class="chip ghost" id="addSecond">＋ 語を追加</button>
        <button class="chip ghost" id="addExcl">− 除外</button>
        <span class="divider"></span>
        <span id="filterChips" style="display: contents"></span>
        <button class="chip link hidden" id="clearFilters">絞り込みを全て解除</button>
      </div>
    </section>

    <div class="file-list hidden" id="fileList" aria-label="読み込んだファイル"></div>
    <div id="notices"></div>
    <div class="dropzone" id="dropzone" tabindex="0" role="button">
      <p><b>Excel（.xlsx）または CSV ファイルをここにドロップ</b>、またはクリックして選択（複数可）</p>
      <p class="muted" style="font-size: 0.85em">ファイルはこのブラウザの中だけで読み込まれ、外部には送信されません。</p>
    </div>
    <progress id="progress" class="hidden"></progress>
    <div class="status" id="status" aria-live="polite"></div>

    <nav class="view-tabs hidden" id="viewTabs" aria-label="表示">
      <button data-view="results" class="on">検索結果</button>
      <button data-view="terms">共起語</button>
    </nav>
    <section class="terms-panel hidden" id="termsPanel" aria-label="共起語の探索">
      <div class="term-controls">
        <label>単位 <select id="termUnit"><option value="report">レポート</option><option value="row">文</option></select></label>
        <label>並び順 <select id="termRank"><option value="count">出現数</option><option value="lift">リフト</option></select></label>
        <label>最小出現数 <input id="termMin" type="number" min="1" value="3"></label>
        <label>表示語数 <input id="termTop" type="number" min="1" max="500" value="50"></label>
      </div>
      <p class="term-caption">同じ文にある語を抽出します。レポート単位では繰り返しを1件と数えます。語の切り出しは漢字・カタカナ・英字の連なりです。</p>
      <nav class="term-trail" id="termTrail" aria-label="探索履歴"></nav>
      <p class="term-caption" id="termCondition"></p>
      <div class="term-actions" id="termHistoryActions" hidden>
        <button class="link" id="termBack">1つ前に戻る</button>

<script>
"use strict";

/* =====================================================================

const TEXT_COLUMN = "本文";
const YEAR_COLUMN = "年(CDEX)";
const RATING_COLUMN = "発行体格付(業務)";
const SOURCE_COLUMN = "ファイル";  // 複数ファイルを読み込んだときだけ作る列（行の元のファイル名）
const EXPECTED_COLUMNS = [
  "発行体ID(業務)", "発行体コード(業務)", "証券コード(CDEX)", YEAR_COLUMN, "公表日(CDEX)",
  "発行体名(CDEX)", "発行体名(業務)", "業種(業務)", "担当部署(業務)", "担当アナリスト(CDEX)",

];
// 前回のレポートと比べた変化（読み込み時に作る列。server/merge.py の add_change_columns と同じ）
const PREV_RATING_COLUMN = "前回格付";
const RATING_CHANGE_COLUMN = "格付の変化";
const OUTLOOK_CHANGE_COLUMN = "方向性の変化";
const RATING_CHANGE_ORDER = ["引き上げ", "引き下げ", "据え置き", "前回なし"];
const OUTLOOK_CHANGE_ORDER = ["上向き", "下向き", "その他の変更", "変化なし", "前回なし"];
const OUTLOOK_ORDER = ["ポジティブ", "安定的", "ネガティブ"];  // 良い順
const FILTER_COLUMNS = [SOURCE_COLUMN, RATING_COLUMN, RATING_CHANGE_COLUMN, OUTLOOK_CHANGE_COLUMN,
  "業種(業務)", "担当部署(業務)", "担当アナリスト(CDEX)", "格付アクション(業務)"];
const FILTER_LABELS = {
  [SOURCE_COLUMN]: "ファイル", [RATING_COLUMN]: "格付", [RATING_CHANGE_COLUMN]: "格付の変化",
  [OUTLOOK_CHANGE_COLUMN]: "方向性の変化", "業種(業務)": "業種", "担当部署(業務)": "担当部署",
  "担当アナリスト(CDEX)": "担当", "格付アクション(業務)": "アクション",
};
const RATING_ORDER = ["AAA", "AA+", "AA", "AA-", "A+", "A", "A-", "BBB+", "BBB", "BBB-",
  "BB+", "BB", "BB-", "B+", "B", "B-", "CCC", "CC", "C", "D"];
const DEFAULT_YEAR_FROM = 2016, DEFAULT_YEAR_TO = 2026;

const MODES = [
  { id: "row", label: "同じ文に両方", hint: "1つの文に両方の語が入る" },
  { id: "report", label: "同じレポートに両方", hint: "別の文でも、同じレポートに両方の語が入る" },
  { id: "or", label: "どちらか", hint: "どちらか一方でも含む" },
];
const FONTS = ["BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", "BIZ UDPMincho", "Yu Mincho", "system-ui"];
const DEFAULT_SETTINGS = { fontSize: 18, context: 45, font: "BIZ UDPGothic", theme: "auto" };
const RECENT_MAX = 30, RECENT_SHOWN = 12;
const OVERSCAN = 6;
const DB_NAME = "phraseSearch", DB_STORE = "datasets", CACHE_VERSION = 1;
const DB_KEY_FILES = "files", DB_KEY_LEGACY = "current";  // files: 読み込んだファイルの一覧（current は 1 ファイルだけの旧形式）

/* =====================================================================
 * 小さなユーティリティ
 * ===================================================================== */
const $ = (id) => document.getElementById(id);
const tick = () => new Promise((r) => setTimeout(r, 0));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n).toLocaleString("ja-JP");

function persistGet(key, initial) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return initial;
    const parsed = JSON.parse(raw);
    return initial && typeof initial === "object" && !Array.isArray(initial) ? { ...initial, ...parsed } : parsed;
  } catch (e) { return initial; }
}
function persistSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 保存できなくても動作は続ける */ }
}

/* =====================================================================
 * ZIP / XLSX リーダー（外部ライブラリなし。ブラウザ標準の DecompressionStream を使う）
 * ===================================================================== */
function readZipDirectory(buf) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 22 - 65535); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Excel（.xlsx）として読み込めませんでした。ファイルが壊れているか、形式が違います。");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = {};
  const dec = new TextDecoder();
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    entries[name] = { method, csize, lho };
    p += 46 + nlen + xlen + clen;
  }
  return { entries, dv, u8 };
}

function zipEntryTextStream(zip, name) {
  const en = zip.entries[name];
  if (!en) return null;
  if (en.csize === 0xffffffff) throw new Error("ZIP64 形式のファイルには対応していません。");
  const { dv, u8 } = zip;
  const nlen = dv.getUint16(en.lho + 26, true), xlen = dv.getUint16(en.lho + 28, true);
  const start = en.lho + 30 + nlen + xlen;
  let stream = new Blob([u8.subarray(start, start + en.csize)]).stream();
  if (en.method === 8) {
    if (typeof DecompressionStream === "undefined") {
      throw new Error("このブラウザは Excel の展開に対応していません。Chrome / Edge / Safari / Firefox の最近の版をお使いください。");
    }
    stream = stream.pipeThrough(new DecompressionStream("deflate-raw"));
  } else if (en.method !== 0) {
    throw new Error("未対応の圧縮方式です。");
  }
  return stream.pipeThrough(new TextDecoderStream("utf-8"));
}

async function forEachChunk(stream, fn) {
  const reader = stream.getReader();
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    await fn(value);
  }
}

async function readAllText(stream) {
  let s = "";
  await forEachChunk(stream, (c) => { s += c; });
  return s;
}

const XML_ENT = { amp: "&", lt: "<", gt: ">", quot: '"', apos: "'" };
function unescapeXml(s) {
  if (s.indexOf("&") >= 0) {
    s = s.replace(/&(#x[0-9a-fA-F]+|#\d+|amp|lt|gt|quot|apos);/g, (m, g) => {
      if (g[0] !== "#") return XML_ENT[g];
      const cp = g[1] === "x" || g[1] === "X" ? parseInt(g.slice(2), 16) : parseInt(g.slice(1), 10);
      return String.fromCodePoint(cp);
    });
  }
  if (s.indexOf("_x") >= 0) s = s.replace(/_x([0-9A-Fa-f]{4})_/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
  return s;
}

/** <si> / <is> の中の文字列（ルビ rPh は除く）を連結する。 */
function textOfRuns(xml) {
  if (xml.indexOf("<rPh") >= 0) xml = xml.replace(/<rPh\b[\s\S]*?<\/rPh>/g, "");
  let out = "";
  const re = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g;
  let m;
  while ((m = re.exec(xml))) out += m[1];
  return unescapeXml(out);
}

function parseSharedStrings(xml) {
  const out = [];
  const re = /<si\b[^>]*?(?:\/>|>([\s\S]*?)<\/si>)/g;
  let m;
  while ((m = re.exec(xml))) out.push(m[1] ? textOfRuns(m[1]) : "");
  return out;
}

function parseDateStyles(xml) {
  const customDate = {};
  const reFmt = /<numFmt\b[^>]*numFmtId="(\d+)"[^>]*formatCode="([^"]*)"/g;
  let m;
  while ((m = reFmt.exec(xml))) {
    const code = unescapeXml(m[2]).replace(/"[^"]*"|\\.|\[[^\]]*\]|_.|\*./g, "");
    customDate[m[1]] = /[ymdhs]/i.test(code);
  }
  const isBuiltInDate = (id) => (id >= 14 && id <= 22) || (id >= 27 && id <= 36) || (id >= 45 && id <= 47) || (id >= 50 && id <= 58);
  const dateXf = [];
  const block = /<cellXfs\b[^>]*>([\s\S]*?)<\/cellXfs>/.exec(xml);
  if (block) {
    const reXf = /<xf\b[^>]*?numFmtId="(\d+)"/g;
    while ((m = reXf.exec(block[1]))) {
      const id = Number(m[1]);
      dateXf.push(isBuiltInDate(id) || customDate[m[1]] === true);
    }
  }
  return dateXf;
}

function serialToDate(text) {
  const serial = Number(text);
  if (!isFinite(serial)) return text;
  const d = new Date(Math.round((serial - 25569) * 86400000));
  const p2 = (n) => String(n).padStart(2, "0");
  const date = `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())}`;
  return Number.isInteger(serial) ? date : `${date} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}`;
}

function colIndex(letters) {
  let n = 0;
  for (let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
  return n - 1;
}

async function firstSheetPath(zip) {
  const wb = zipEntryTextStream(zip, "xl/workbook.xml");
  const rels = zipEntryTextStream(zip, "xl/_rels/workbook.xml.rels");
  if (wb && rels) {
    const wbXml = await readAllText(wb);
    const relXml = await readAllText(rels);
    const sheet = /<sheet\b[^>]*?r:id="([^"]+)"/.exec(wbXml);
    if (sheet) {
      const reRel = /<Relationship\b[^>]*>/g;
      let m;
      while ((m = reRel.exec(relXml))) {
        const id = /\bId="([^"]+)"/.exec(m[0]);
        const target = /\bTarget="([^"]+)"/.exec(m[0]);
        if (id && target && id[1] === sheet[1]) {
          const t = target[1];
          return t.startsWith("/") ? t.slice(1) : "xl/" + t;
        }
      }
    }
  }
  return "xl/worksheets/sheet1.xml";
}

/** .xlsx の先頭シートを読み、EXPECTED_COLUMNS に当たる列だけを文字列配列として返す。 */
async function parseXlsx(file, onProgress) {
  const zip = readZipDirectory(await file.arrayBuffer());
  const sheetPath = await firstSheetPath(zip);
  if (!zip.entries[sheetPath]) throw new Error("シートが見つかりませんでした。");

  let shared = [];
  const ssStream = zipEntryTextStream(zip, "xl/sharedStrings.xml");
  if (ssStream) shared = parseSharedStrings(await readAllText(ssStream));
  let dateXf = [];
  const stStream = zipEntryTextStream(zip, "xl/styles.xml");
  if (stStream) dateXf = parseDateStyles(await readAllText(stStream));

  const wanted = new Set(EXPECTED_COLUMNS);
  let header = null;            // Map(列番号 -> 配列の位置)
  const names = [];             // 配列の位置 -> 列名
  const arrays = [];
  let nRows = 0;

  const rowRe = /<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g;
  const cellRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
  const reR = /\br="([A-Z]+)\d+"/, reT = /\bt="([^"]*)"/, reS = /\bs="(\d+)"/;
  const reV = /<v>([\s\S]*?)<\/v>/;

  function cellValue(attrs, inner) {
    if (!inner) return "";
    const t = reT.exec(attrs);
    const type = t ? t[1] : "n";
    if (type === "inlineStr") return textOfRuns(inner);
    const v = reV.exec(inner);
    if (!v) return "";
    const raw = v[1];
    if (type === "s") return shared[Number(raw)] ?? "";
    if (type === "str") return unescapeXml(raw);
    if (type === "b") return raw === "1" ? "TRUE" : "FALSE";
    if (type === "e") return "";
    if (type === "d") return raw;
    const s = reS.exec(attrs);
    if (s && dateXf[Number(s[1])]) return serialToDate(raw);
    return raw;
  }

  function processRows(xml) {
    rowRe.lastIndex = 0;
    let rm;
    while ((rm = rowRe.exec(xml))) {
      const inner = rm[1];
      if (!inner) continue;
      cellRe.lastIndex = 0;
      let cm, prev = -1;
      if (!header) {
        const found = [];
        while ((cm = cellRe.exec(inner))) {
          const r = reR.exec(cm[1]);
          const col = r ? colIndex(r[1]) : prev + 1;
          prev = col;
          found.push([col, cellValue(cm[1], cm[2]).trim()]);
        }
        if (!found.some(([, v]) => v)) continue;
        header = new Map();
        for (const [col, v] of found) {
          if (wanted.has(v) && !names.includes(v)) { header.set(col, names.length); names.push(v); arrays.push([]); }
        }
        continue;
      }
      const vals = new Array(names.length).fill("");
      let any = false;
      while ((cm = cellRe.exec(inner))) {
        const r = reR.exec(cm[1]);
        const col = r ? colIndex(r[1]) : prev + 1;
        prev = col;
        const pos = header.get(col);
        if (pos === undefined) continue;
        const v = cellValue(cm[1], cm[2]);
        if (v) { vals[pos] = v; any = true; }
      }
      if (!any) continue;
      for (let k = 0; k < vals.length; k++) arrays[k].push(vals[k]);
      nRows++;
    }
  }

  let buf = "";
  await forEachChunk(zipEntryTextStream(zip, sheetPath), async (chunk) => {
    buf += chunk;
    const last = buf.lastIndexOf("</row>");
    if (last < 0) return;
    processRows(buf.slice(0, last + 6));
    buf = buf.slice(last + 6);
    onProgress(nRows);
    await tick();
  });
  processRows(buf);
  onProgress(nRows);

  if (!header) throw new Error("シートにデータがありません。");
  const cols = {};
  names.forEach((n, i) => { cols[n] = arrays[i]; });
  return cols;
}

/* =====================================================================
 * CSV リーダー
 * ===================================================================== */
function decodeCsv(buf) {
  try {
    return new TextDecoder("utf-8", { fatal: true }).decode(buf);
  } catch (e) {
    return new TextDecoder("shift_jis").decode(buf);
  }
}

function parseCsvText(text) {
  const rows = [];
  const n = text.length;
  const re = /[^,\r\n]*/y;
  let i = 0, row = [];
  while (i < n) {
    let field;
    if (text.charCodeAt(i) === 34) {
      let j = i + 1, out = "";
      for (;;) {
        const k = text.indexOf('"', j);
        if (k < 0) { out += text.slice(j); j = n; break; }
        if (text.charCodeAt(k + 1) === 34) { out += text.slice(j, k + 1); j = k + 2; continue; }
        out += text.slice(j, k); j = k + 1; break;
      }
      field = out; i = j;
    } else {
      re.lastIndex = i;
      field = re.exec(text)[0];
      i += field.length;
    }
    row.push(field);
    const c = text.charCodeAt(i);
    if (c === 44) { i++; if (i >= n) { row.push(""); rows.push(row); row = []; } continue; }
    if (c === 13) { i++; if (text.charCodeAt(i) === 10) i++; rows.push(row); row = []; continue; }
    if (c === 10) { i++; rows.push(row); row = []; continue; }
  }
  if (row.length) rows.push(row);
  return rows;
}

async function parseCsvFile(file, onProgress) {
  const rows = parseCsvText(decodeCsv(await file.arrayBuffer()));
  const head = rows.findIndex((r) => r.some((v) => v.trim()));
  if (head < 0) throw new Error("ファイルにデータがありません。");
  const wanted = new Set(EXPECTED_COLUMNS);
  const picks = [];
  const cols = {};
  rows[head].forEach((v, idx) => {
    v = v.trim();
    if (wanted.has(v) && !(v in cols)) { picks.push([idx, v]); cols[v] = []; }
  });
  for (let r = head + 1; r < rows.length; r++) {
    const row = rows[r];
    if (row.length === 1 && row[0] === "") continue;
    for (const [idx, name] of picks) cols[name].push(row[idx] ?? "");
    if (r % 5000 === 0) { onProgress(r - head); await tick(); }
  }
  onProgress(rows.length - head - 1);
  return cols;
}

/* =====================================================================
 * データのキャッシュ（IndexedDB）
 * ===================================================================== */
function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const q = db.transaction(DB_STORE).objectStore(DB_STORE).get(key);
    q.onsuccess = () => resolve(q.result);
    q.onerror = () => reject(q.error);
  });
}
async function idbPut(key, value) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

/* =====================================================================
 * 状態・テーブル
 * ===================================================================== */
const S = {
  files: [],             // 読み込んだファイル [{ name, savedAt, cols }]（読み込んだ順）
  sources: [],           // ファイルごとの { name, rows, dropped }（dropped: 前のファイルと重複して除いた行数）
  table: null,           // { n, cols, text, years, reportIds, nReports, fvalues, fcodes }
  filters: { year: null, sel: {} },
  mask: null,            // 絞り込みに合う行（null は全行）
  pool: 0,               // 絞り込み後の行数
  mode: persistGet("ps.mode", "report"),
  recent: persistGet("ps.recent", []),
  settings: persistGet("ps.settings", DEFAULT_SETTINGS),
  hits: null,
  terms: [],
  excl: [],
  loadingText: "",
  error: "",
  composing: false,
  chipUpdaters: [],
  view: persistGet("ps.html.view", "results") === "terms" ? "terms" : "results",
  termSettings: normalizeTermSettings(persistGet("ps.html.terms", {})),
  datasetVersion: 0,
  exploration: { rootKey: "", steps: [], selected: "", result: null, run: 0, contextLimit: 100 },
};

function ratingRank(v) {
  const i = RATING_ORDER.indexOf(v);
  return i < 0 ? 99 : i;
}

/** 全角→半角・【】と空白を除く（「【AA－】」「AA-」を同じ値にする）。 */
function cleanLabel(v) {
  return String(v ?? "").normalize("NFKC").replace(/[【】\s]/g, "").replace(/[−－‐–]/g, "-");
}

/** 格付記号を取り出す（「AA-」「【AA－】」「AA-(安定的)」→ AA-）。読めなければ ""。 */
function ratingSymbol(v) {
  const m = /^(?:AAA|AA|A|BBB|BB|B|CCC|CC|C|D)[+-]?(?![A-Z])/.exec(cleanLabel(v).toUpperCase());
  return m ? m[0] : "";
}

/**
 * 公表日を YYYYMMDD の数にする。読めなければ NaN。
 * 「2025/3/5」「2025-03-05 00:00:00」「2025年3月5日」「20250305」、Excel の日付シリアル値（45721 など）に対応。
 */
function dateNumber(v) {
  const t = String(v ?? "").normalize("NFKC").trim();
  let m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(t);
  if (m) return +m[1] * 10000 + +m[2] * 100 + +m[3];
  m = /^(\d{4})(\d{2})(\d{2})$/.exec(t);
  if (m) return +m[1] * 10000 + +m[2] * 100 + +m[3];
  if (/^\d{5}(\.\d+)?$/.test(t)) {
    const d = new Date(Math.round((Number(t) - 25569) * 86400000));
    return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate();
  }
  return NaN;
}

const ISSUER_COLUMNS = ["発行体ID(業務)", "発行体コード(業務)", "発行体名(CDEX)", "発行体名(業務)"];
const DATE_COLUMNS = ["公表日(業務)", "公表日(CDEX)"];

/**
 * 発行体ごとに公表日順に並べ、1つ前のレポートと比べた「前回格付」「格付の変化」「方向性の変化」の列を作る。
 * レポート = 発行体（ID、空なら コード → 名前）＋公表日（公表日(業務)、空なら 公表日(CDEX)）。
 * 比べるのは読み込んだデータの中だけ。判定できなかった理由は S.changeDiag に残す。
 */
function addChangeColumns(cols) {
  const n = cols[TEXT_COLUMN].length;
  const issCols = ISSUER_COLUMNS.filter((c) => cols[c]);
  const dateCols = DATE_COLUMNS.filter((c) => cols[c]);
  const diag = { n, noIssuer: 0, noDate: 0, noRating: 0, reports: 0, withPrev: 0, dateSamples: [], ratingSamples: [] };
  S.changeDiag = diag;
  if (!issCols.length || !dateCols.length || !cols[RATING_COLUMN]) { diag.missing = true; return cols; }
  const rat = cols[RATING_COLUMN], out = cols["格付の方向性(業務)"];
  const pick = (names, i, read) => {
    for (const c of names) { const v = read(cols[c][i]); if (v !== "" && !Number.isNaN(v)) return v; }
    return names === dateCols ? NaN : "";
  };
  // レポートごとに最初に読める格付・方向性
  const reports = new Map();
  const keyOf = new Array(n);
  for (let i = 0; i < n; i++) {
    const id = pick(issCols, i, (v) => String(v ?? "").trim());
    const d = pick(dateCols, i, dateNumber);
    if (!id) { diag.noIssuer++; continue; }
    if (Number.isNaN(d)) {
      diag.noDate++;
      const raw = dateCols.map((c) => cols[c][i]).find((v) => String(v ?? "").trim() !== "");
      if (raw !== undefined && diag.dateSamples.length < 3 && !diag.dateSamples.includes(String(raw))) diag.dateSamples.push(String(raw));
      continue;
    }
    const key = id + "\u0001" + d;
    keyOf[i] = key;
    let r = reports.get(key);
    if (!r) reports.set(key, (r = { id, d, rating: "", outlook: "" }));
    const sym = ratingSymbol(rat[i]);
    if (!sym && String(rat[i] ?? "").trim() && diag.ratingSamples.length < 3 && !diag.ratingSamples.includes(String(rat[i]))) {
      diag.ratingSamples.push(String(rat[i]));
    }
    if (!r.rating) r.rating = sym;
    if (!r.outlook && out) r.outlook = cleanLabel(out[i]);
  }
  const byIssuer = new Map();
  for (const r of reports.values()) {
    if (!byIssuer.has(r.id)) byIssuer.set(r.id, []);
    byIssuer.get(r.id).push(r);
  }
  diag.reports = reports.size;
  diag.issuers = byIssuer.size;
  const rk = (v) => RATING_ORDER.indexOf(v), ok = (v) => OUTLOOK_ORDER.indexOf(v);
  for (const list of byIssuer.values()) {
    list.sort((a, b) => a.d - b.d);
    list.forEach((r, k) => {
      const p = k > 0 ? list[k - 1] : null;
      if (p) diag.withPrev++;
      if (!r.rating) diag.noRating++;
      r.prev = p ? p.rating : "";
      r.rc = "前回なし";
      if (p && rk(r.rating) >= 0 && rk(p.rating) >= 0) {
        const d = rk(r.rating) - rk(p.rating);
        r.rc = d < 0 ? "引き上げ" : d > 0 ? "引き下げ" : "据え置き";
      }
      r.oc = "前回なし";
      if (p && r.outlook && p.outlook) {
        if (r.outlook === p.outlook) r.oc = "変化なし";
        else if (ok(r.outlook) >= 0 && ok(p.outlook) >= 0) r.oc = ok(r.outlook) < ok(p.outlook) ? "上向き" : "下向き";
        else r.oc = "その他の変更";
      }
    });
  }
  const prev = new Array(n), rc = new Array(n), oc = new Array(n);
  for (let i = 0; i < n; i++) {
    const r = keyOf[i] && reports.get(keyOf[i]);
    prev[i] = r ? r.prev : "";
    rc[i] = r ? r.rc : "前回なし";
    oc[i] = r ? r.oc : "前回なし";
  }
  const added = { [PREV_RATING_COLUMN]: prev, [RATING_CHANGE_COLUMN]: rc };
  if (out) added[OUTLOOK_CHANGE_COLUMN] = oc;
  return { ...cols, ...added };
}

/** 格付の変化がほとんど判定できなかったとき、理由を画面に出す。 */
function changeNotice() {
  const g = S.changeDiag;
  if (!g || g.missing) return;
  const judged = S.table.cols[RATING_CHANGE_COLUMN].filter((v) => v !== "前回なし").length;
  if (judged > 0) return;
  const parts = [`格付の変化を判定できませんでした（すべて「前回なし」）。レポート ${fmt(g.reports)} 件・発行体 ${fmt(g.issuers || 0)} 社、前回のレポートがあるのは ${fmt(g.withPrev)} 件です。`];
  if (g.noIssuer) parts.push(`発行体（ID・コード・名前）が空の行: ${fmt(g.noIssuer)} 行。`);
  if (g.noDate) parts.push(`公表日が読めない行: ${fmt(g.noDate)} 行${g.dateSamples.length ? `（例: ${g.dateSamples.map((x) => "「" + esc(x) + "」").join(" ")}）` : ""}。`);
  if (g.ratingSamples.length) parts.push(`格付記号として読めない値の例: ${g.ratingSamples.map((x) => "「" + esc(x) + "」").join(" ")}。`);
  if (!g.noDate && !g.noIssuer && g.withPrev === 0) parts.push("同じ発行体のレポートが1件ずつしかありません（発行体の列が行ごとに違う値になっていないか確認してください）。");
  notice("", parts.join(" "));
}

function buildTable(cols) {
  cols = addChangeColumns(cols);
  const text = cols[TEXT_COLUMN];
  const n = text.length;
  const t = { n, cols, text, years: null, reportIds: null, nReports: 0, fvalues: {}, fcodes: {} };

  if (cols[YEAR_COLUMN]) {
    const years = new Float64Array(n);
    const src = cols[YEAR_COLUMN];
    for (let i = 0; i < n; i++) {
      const v = parseFloat(src[i]);
      years[i] = isFinite(v) ? Math.trunc(v) : NaN;
    }
    t.years = years;
  }

  let dateCol = null;
  for (const c of ["公表日(業務)", "公表日(CDEX)"]) if (cols[c]) { dateCol = c; break; }
  if (cols["発行体ID(業務)"] && dateCol) {
    const ids = new Int32Array(n);
    const map = new Map();
    const a = cols["発行体ID(業務)"], b = cols[dateCol];
    for (let i = 0; i < n; i++) {
      const key = a[i] + "\u0001" + b[i];
      let id = map.get(key);
      if (id === undefined) { id = map.size; map.set(key, id); }
      ids[i] = id;
    }
    t.reportIds = ids;
    t.nReports = map.size;
  }

  for (const c of FILTER_COLUMNS) {
    if (!cols[c]) continue;
    const set = new Set(cols[c]);
    set.delete("");
    const values = [...set];
    const order = c === RATING_CHANGE_COLUMN ? RATING_CHANGE_ORDER : c === OUTLOOK_CHANGE_COLUMN ? OUTLOOK_CHANGE_ORDER : null;
    if (order) values.sort((a, b) => order.indexOf(a) - order.indexOf(b));
    else if (c === RATING_COLUMN) values.sort((a, b) => ratingRank(a) - ratingRank(b) || (a < b ? -1 : a > b ? 1 : 0));
    else values.sort((a, b) => a.localeCompare(b, "ja"));
    const index = new Map(values.map((v, k) => [v, k]));
    const codes = new Int32Array(n);
    const src = cols[c];
    for (let i = 0; i < n; i++) { const k = index.get(src[i]); codes[i] = k === undefined ? -1 : k; }
    t.fvalues[c] = values;
    t.fcodes[c] = codes;
  }
  return t;
}

/** 重複の判定に使う列（発行体ID＋公表日＋本文。ID・公表日が無ければ、全列）。server/main.py と同じ。 */
function dedupKeyColumns(names) {
  const date = ["公表日(業務)", "公表日(CDEX)"].find((c) => names.includes(c));
  return names.includes("発行体ID(業務)") && date ? ["発行体ID(業務)", date, TEXT_COLUMN] : names;
}

/** 複数ファイルの列を縦につなぐ。前のファイルにすでにある行は、後のファイルから除く（同じファイルの中の重複は残す）。 */
function mergeFiles(files) {
  if (files.length === 1) {
    return { cols: files[0].cols, sources: [{ name: files[0].name, rows: files[0].cols[TEXT_COLUMN].length, dropped: 0 }] };
  }
  const names = EXPECTED_COLUMNS.filter((c) => files.some((f) => f.cols[c]));
  const keyCols = dedupKeyColumns(names);
  const cols = Object.fromEntries(names.map((c) => [c, []]));
  cols[SOURCE_COLUMN] = [];
  const seen = new Set();
  const sources = [];
  for (const f of files) {
    const n = f.cols[TEXT_COLUMN].length;
    const get = (c, i) => (f.cols[c] ? f.cols[c][i] ?? "" : "");
    const mine = [];
    let dropped = 0;
    for (let i = 0; i < n; i++) {
      const key = keyCols.map((c) => get(c, i)).join("\u0001");
      if (seen.has(key)) { dropped++; continue; }
      mine.push(key);
      for (const c of names) cols[c].push(get(c, i));
      cols[SOURCE_COLUMN].push(f.name);
    }
    for (const k of mine) seen.add(k);
    sources.push({ name: f.name, rows: n - dropped, dropped });
  }
  return { cols, sources };
}

function yearBounds() {
  const y = S.table && S.table.years;
  if (!y) return null;
  let min = Infinity, max = -Infinity;
  for (let i = 0; i < y.length; i++) { const v = y[i]; if (v < min) min = v; if (v > max) max = v; }
  return isFinite(min) ? [min, max] : null;
}

/* =====================================================================
 * 絞り込み
 * ===================================================================== */
function recomputeMask() {
  const t = S.table;
  const { year, sel } = S.filters;
  const active = FILTER_COLUMNS.filter((c) => sel[c] && sel[c].size && t.fvalues[c]);
  if (!year && !active.length) { S.mask = null; S.pool = t.n; return; }
  const mask = new Uint8Array(t.n).fill(1);
  if (year && t.years) {
    const [lo, hi] = year;
    for (let i = 0; i < t.n; i++) { const y = t.years[i]; if (!(y >= lo && y <= hi)) mask[i] = 0; }
  }
  for (const c of active) {
    const ok = new Uint8Array(t.fvalues[c].length);
    t.fvalues[c].forEach((v, k) => { if (sel[c].has(v)) ok[k] = 1; });
    const codes = t.fcodes[c];
    for (let i = 0; i < t.n; i++) { const k = codes[i]; if (k < 0 || !ok[k]) mask[i] = 0; }
  }
  let pool = 0;
  for (let i = 0; i < t.n; i++) pool += mask[i];
  S.mask = mask;
  S.pool = pool;
}

function filtersChanged() {
  recomputeMask();
  S.chipUpdaters.forEach((f) => f());
  const any = S.filters.year || Object.values(S.filters.sel).some((v) => v.size);
  $("clearFilters").classList.toggle("hidden", !any);
  refresh();
}

/* ---- ポップアップ（開くのは常に1つ。外側クリック・Esc で閉じる） ---- */
let openAnchor = null;
function closePop() {
  if (!openAnchor) return;
  const pop = openAnchor.querySelector(".popover");
  if (pop) pop.hidden = true;
  const btn = openAnchor.querySelector("[aria-expanded]");
  if (btn) btn.setAttribute("aria-expanded", "false");
  openAnchor = null;
}
function togglePop(anchor) {
  const wasOpen = openAnchor === anchor;
  closePop();
  if (wasOpen) return;
  openAnchor = anchor;
  anchor.querySelector(".popover").hidden = false;
  const btn = anchor.querySelector("[aria-expanded]");
  if (btn) btn.setAttribute("aria-expanded", "true");
  const find = anchor.querySelector(".pop-find");
  if (find) find.focus();
}
document.addEventListener("mousedown", (e) => { if (openAnchor && !openAnchor.contains(e.target)) closePop(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePop(); });

function addYearChip(host, [min, max]) {
  const years = Array.from({ length: max - min + 1 }, (_, i) => min + i);
  const anchor = document.createElement("div");
  anchor.className = "pop-anchor";
  const opts = years.map((y) => `<option>${y}</option>`).join("");
  anchor.innerHTML = `<span class="chip"><button class="chip-main" aria-expanded="false"></button><button class="chip-x" aria-label="年の絞り込みを解除">×</button></span>
    <div class="popover year-pop" hidden>
      <div class="year-row"><select class="y-from" aria-label="開始年">${opts}</select><span>–</span><select class="y-to" aria-label="終了年">${opts}</select></div>
      <div class="year-grid">${years.map((y) => `<button data-y="${y}">${y}</button>`).join("")}</div>
      <div class="pop-foot"><button class="link" data-act="all">全期間</button><button class="link" data-act="close">閉じる</button></div>
    </div>`;
  host.appendChild(anchor);
  const chip = anchor.querySelector(".chip"), main = anchor.querySelector(".chip-main"), x = anchor.querySelector(".chip-x");
  const sFrom = anchor.querySelector(".y-from"), sTo = anchor.querySelector(".y-to");
  const grid = [...anchor.querySelectorAll(".year-grid button")];
  const set = (a, b) => { S.filters.year = a === min && b === max ? null : [Math.min(a, b), Math.max(a, b)]; filtersChanged(); };
  const update = () => {
    const v = S.filters.year;
    const [lo, hi] = v || [min, max];
    chip.classList.toggle("active", !!v);
    main.innerHTML = v ? `年<b>: ${lo}–${hi}</b>` : '年<span class="caret">▾</span>';
    x.classList.toggle("hidden", !v);
    sFrom.value = lo; sTo.value = hi;
    grid.forEach((b) => { const y = Number(b.dataset.y); b.classList.toggle("in", y >= lo && y <= hi); });
  };
  main.addEventListener("click", () => togglePop(anchor));
  x.addEventListener("click", () => { S.filters.year = null; filtersChanged(); });
  sFrom.addEventListener("change", () => set(Number(sFrom.value), Number(sTo.value)));
  sTo.addEventListener("change", () => set(Number(sFrom.value), Number(sTo.value)));
  grid.forEach((b) => {
    b.addEventListener("click", () => { const y = Number(b.dataset.y); set(y, y); });

  anchor.querySelector('[data-act="close"]').addEventListener("click", closePop);

function addMultiChip(host, col) {
  const values = S.table.fvalues[col];

      <div class="pop-foot"><button class="link" data-act="clear">解除</button><button class="link" data-act="close">閉じる</button></div>
