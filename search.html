  update();
}

function buildFilterUi() {
  const host = $("filterChips");
  host.innerHTML = "";
  S.chipUpdaters = [];
  S.filters = { year: null, sel: {} };
  const b = yearBounds();
  if (b && b[0] < b[1]) {
    const lo = Math.max(b[0], DEFAULT_YEAR_FROM), hi = Math.min(b[1], DEFAULT_YEAR_TO);
    if (lo <= hi && (lo !== b[0] || hi !== b[1])) S.filters.year = [lo, hi];
    addYearChip(host, b);
  }
  for (const c of FILTER_COLUMNS) if (S.table.fvalues[c]) addMultiChip(host, c);
  $("clearFilters").classList.toggle("hidden", !S.filters.year);
  recomputeMask();
}

/* =====================================================================
 * 検索（app.py の find_hits / mask_excluded / build_snippet と同じ挙動）
 * ===================================================================== */
function maskExcluded(text, excl) {
  for (const ph of excl) if (text.indexOf(ph) >= 0) text = text.split(ph).join("\0".repeat(ph.length));
  return text;
}
const sortExcl = (excl) => excl.filter(Boolean).sort((a, b) => b.length - a.length);
const effectiveMode = () => (S.mode === "report" && !(S.table && S.table.reportIds) ? "row" : S.mode);

function findHits(terms, mode, excl, t = S.table, mask = S.mask) {
  const n = t.n, text = t.text;
  if (!terms.length) return new Int32Array();
  const masks = terms.map(() => new Uint8Array(n));
  for (let i = 0; i < n; i++) {
    if (mask && !mask[i]) continue;
    const s = excl.length ? maskExcluded(text[i], excl) : text[i];
    for (let j = 0; j < terms.length; j++) if (s.includes(terms[j])) masks[j][i] = 1;
  }
  const out = [];
  if (terms.length === 1 || mode === "or") {
    for (let i = 0; i < n; i++) if (masks.some((a) => a[i])) out.push(i);
  } else if (mode === "row" || !t.reportIds) {
    for (let i = 0; i < n; i++) if (masks.every((a) => a[i])) out.push(i);
  } else {
    const rid = t.reportIds;
    const present = masks.map((a) => {
      const flags = new Uint8Array(t.nReports);
      for (let i = 0; i < n; i++) if (a[i]) flags[rid[i]] = 1;
      return flags;
    });
    for (let i = 0; i < n; i++) if (masks.some((a) => a[i]) && present.every((a) => a[rid[i]])) out.push(i);
  }
  return Int32Array.from(out);
}

/**
 * 結果の並び: 年の新しい順 → 格付の高い順（AAA→D）→ 業種（文字順）→ 公表日の新しい順 → 発行体名。
 * 同じレポートの文は元の並び（文の順）を保つ。
 */
function sortHits(hits) {
  const t = S.table, c = t.cols, years = t.years;
  const col = (name) => c[name] || null;
  const rating = col(RATING_COLUMN), ind = col("業種(業務)"), issuer = col("発行体名(CDEX)");
  const date = col("公表日(CDEX)") || col("公表日(業務)");
  const str = (a, i) => (a ? String(a[i] ?? "") : "");
  const cmpStr = (x, y) => (x === y ? 0 : x === "" ? 1 : y === "" ? -1 : x < y ? -1 : 1);
  return Int32Array.from(Array.from(hits).sort((a, b) => {
    if (years) {
      const ya = years[a], yb = years[b];
      const na = Number.isNaN(ya), nb = Number.isNaN(yb);
      if (na !== nb) return na ? 1 : -1;
      if (!na && ya !== yb) return yb - ya;
    }
    if (rating) {
      const r = ratingRank(str(rating, a)) - ratingRank(str(rating, b));
      if (r) return r;
    }
    const k = cmpStr(str(ind, a), str(ind, b));
    if (k) return k;
    const da = str(date, a), db = str(date, b);
    if (da !== db) return da === "" ? 1 : db === "" ? -1 : da < db ? 1 : -1;
    return cmpStr(str(issuer, a), str(issuer, b)) || a - b;
  }));
}

/** 一致箇所 [開始, 終了, 何番目の語か]。重なりは結合する。 */
function spansOf(text, terms, excl) {
  const masked = excl.length ? maskExcluded(text, excl) : text;
  const spans = [];
  terms.forEach((q, ti) => {
    let from = 0;
    for (;;) {
      const at = masked.indexOf(q, from);
      if (at < 0) break;
      spans.push([at, at + q.length, ti]);
      from = at + Math.max(1, q.length);
    }
  });
  spans.sort((x, y) => x[0] - y[0] || y[1] - x[1]);
  const merged = [];
  for (const sp of spans) {
    const last = merged[merged.length - 1];
    if (last && sp[0] <= last[1]) last[1] = Math.max(last[1], sp[1]);
    else merged.push(sp.slice());
  }
  return merged;
}

function snippetHtml(text, spans, context, full) {
  const lo = full || !spans.length ? 0 : Math.max(0, spans[0][0] - context);
  const hi = full || !spans.length ? text.length : Math.min(text.length, spans[spans.length - 1][1] + context);
  const out = [];
  if (lo > 0) out.push('<span class="ctx">…</span>');
  let cur = lo;
  for (const [s, e, ti] of spans) {
    if (e <= lo || s >= hi) continue;
    const ss = Math.max(s, lo), ee = Math.min(e, hi);
    if (ss > cur) out.push(`<span class="ctx">${esc(text.slice(cur, ss))}</span>`);
    out.push(`<mark class="t${ti}">${esc(text.slice(ss, ee))}</mark>`);
    cur = ee;
  }
  if (cur < hi) out.push(`<span class="ctx">${esc(text.slice(cur, hi))}</span>`);
  if (hi < text.length) out.push('<span class="ctx">…</span>');
  return `<p class="snippet${full ? " full" : ""}">${out.join("")}</p>`;
}

function metaHtml(row) {
  const c = S.table.cols;
  const g = (col) => (c[col] ? c[col][row] || "" : "");
  const change = g(RATING_CHANGE_COLUMN);
  const moved = change === "引き上げ" || change === "引き下げ";
  // 格付が動いたレポートは「前回 → 今回」で示す
  const now = moved ? `${g(PREV_RATING_COLUMN)} → ${g(RATING_COLUMN)}` : g(RATING_COLUMN);
  const rating = [now, g("格付の方向性(業務)")].filter(Boolean).join(" ");
  const cls = "rating" + (moved ? (change === "引き上げ" ? " up" : " down") : "");
  const rest = [g(YEAR_COLUMN), g("公表日(CDEX)"), g("業種(業務)"), g("格付アクション(業務)"), g("担当アナリスト(CDEX)"), g(SOURCE_COLUMN)].filter(Boolean);
  return `<div class="meta"><span class="issuer">${esc(g("発行体名(CDEX)"))}</span>${rating ? `<span class="${cls}">${esc(rating)}</span>` : ""}<span class="meta-rest">${esc(rest.join(" · "))}</span></div>`;
}

/* =====================================================================
 * 共起語（外部ライブラリ・通信なし。検索条件に一致する文から抽出）
 * ===================================================================== */
function termTokens(text, terms, excl) {
  let value = maskExcluded(String(text), excl);
  for (const term of [...terms].sort((a, b) => b.length - a.length)) value = value.split(term).join(" ");
  return new Set(value.match(/[一-龥々〆]{2,}|[ァ-ヴー]{2,}|[A-Za-z][A-Za-z&/\-]+/g) || []);
}

function normalizeTermSettings(value) {
  value = value && typeof value === "object" ? value : {};
  const integer = (n, fallback, max) => Number.isFinite(Number(n)) ? Math.max(1, Math.min(max, Math.trunc(Number(n)))) : fallback;
  return { unit: value.unit === "row" ? "row" : "report", rankBy: value.rankBy === "lift" ? "lift" : "count",
    minCount: integer(value.minCount ?? 3, 3, Number.MAX_SAFE_INTEGER), topN: integer(value.topN ?? 50, 50, 500) };
}

/** UI に制御を返しながら集計し、条件が変わった古い集計は破棄する。 */
async function analyzeTerms(t, mask, terms, mode, excl, settings, cancelled = () => false) {
  const hits = findHits(terms, mode, excl, t, mask);
  const hitMask = new Uint8Array(t.n);
  for (const row of hits) hitMask[row] = 1;
  const isReport = settings.unit === "report" && !!t.reportIds;
  const units = new Map();
  for (let i = 0; i < t.n; i++) {
    if (!mask || mask[i]) {
      const id = isReport ? t.reportIds[i] : i;
      if (!units.has(id)) units.set(id, []);
      units.get(id).push(i);
    }
    if (i % 5000 === 0) { await tick(); if (cancelled()) return null; }
  }
  const foreground = new Map(), background = new Map();
  let nHit = 0, processed = 0;
  for (const rows of units.values()) {
    const fg = new Set(), bg = new Set();
    let matched = false;
    for (const row of rows) {
      const tokens = termTokens(t.text[row], terms, excl);
      for (const word of tokens) {
        bg.add(word);
        if (hitMask[row]) fg.add(word);
      }
      if (hitMask[row]) matched = true;
      if (++processed % 2000 === 0) { await tick(); if (cancelled()) return null; }
    }
    for (const word of bg) background.set(word, (background.get(word) || 0) + 1);
    for (const word of fg) foreground.set(word, (foreground.get(word) || 0) + 1);
    if (matched) nHit++;
  }
  if (cancelled()) return null;
  const candidates = [];
  const rating = /^(?:AAA|AA|A|BBB|BB|B|CCC|CC|C|D)[+-]?$/;
  for (const [word, docs] of foreground) {
    if (docs < settings.minCount || rating.test(word) || terms.some((q) => word.includes(q) || q.includes(word))) continue;
    const count = background.get(word) || 0;
    const rate = docs / nHit;
    candidates.push({ term: word, docs, rate, bg_rate: count / units.size, lift: rate / ((count + 0.5) / (units.size + 1)) });
  }
  candidates.sort((a, b) => (settings.rankBy === "lift" ? b.lift - a.lift || b.docs - a.docs : b.docs - a.docs || b.lift - a.lift)
    || a.term.localeCompare(b.term, "ja"));
  return { terms: candidates.slice(0, settings.topN), totalTerms: candidates.length, nUnits: units.size, nHit, hits, isReport };
}

function syncExploration() {
  const rootKey = JSON.stringify([S.datasetVersion, S.terms, effectiveMode(), S.excl]);
  const x = S.exploration;
  if (x.rootKey !== rootKey) {
    x.rootKey = rootKey;
    x.steps = S.terms.length ? [{ terms: [...S.terms], mode: effectiveMode(), action: "検索語" }] : [];
  }
}

function exploreTerm(word, action) {
  const x = S.exploration, current = x.steps[x.steps.length - 1];
  if (!current || !word) return;
  x.steps.push({ terms: action === "pivot" ? [word] : [...new Set([...current.terms, word])], mode: "row",
    action: action === "pivot" ? "起点" : "絞り込み" });
  return renderTerms();
}

function goToTermStep(index) {
  const x = S.exploration;
  if (!Number.isInteger(index) || index < 0 || index >= x.steps.length) return;
  x.steps = x.steps.slice(0, index + 1);
  return renderTerms();
}

function renderTermTrail() {
  const steps = S.exploration.steps, current = steps[steps.length - 1];
  $("termTrail").innerHTML = steps.map((step, i) => `<button class="chip ${i === steps.length - 1 ? "active" : "ghost"}" data-step="${i}"${i === steps.length - 1 ? ' aria-current="step"' : ""}>${i + 1}. ${step.action}：${esc(step.terms.join("・"))}</button>`).join("");
  const condition = current.terms.length === 1 ? "を含む文" : current.mode === "row" ? "のすべてを同じ文に含む"
    : current.mode === "or" ? "のいずれかを含む文" : "のすべてを同じレポートに含む";
  $("termCondition").textContent = `対象：${current.terms.join("・")}${condition}。格付・期間などは上部の絞り込みを適用します。`;
  $("termHistoryActions").hidden = steps.length < 2;
}

async function renderTerms() {
  const x = S.exploration, run = ++x.run;
  x.selected = ""; x.result = null; x.contextLimit = 100;
  $("termContext").classList.add("hidden");
  $("termSplit").classList.remove("has-context");
  $("termTable").innerHTML = "";
  if (S.view !== "terms" || !S.table || !x.steps.length) return;
  renderTermTrail();
  const settings = S.termSettings;
  const canReport = !!S.table.reportIds;
  $("termUnit").querySelector('option[value="report"]').disabled = !canReport;
  $("termUnit").value = canReport ? settings.unit : "row";
  $("termRank").value = settings.rankBy;
  $("termMin").value = settings.minCount;
  $("termTop").value = settings.topN;
  $("termSummary").textContent = "共起語を解析中…";
  $("termsPanel").setAttribute("aria-busy", "true");
  const current = x.steps[x.steps.length - 1];
  try {
    await tick();
    if (run !== x.run) return;
    const result = await analyzeTerms(S.table, S.mask, current.terms, current.mode, S.excl, { ...settings }, () => run !== x.run);
    if (!result || run !== x.run) return;
    x.result = result;
    const name = result.isReport ? "レポート" : "文";
    $("termSummary").textContent = `一致 ${fmt(result.nHit)} / 全 ${fmt(result.nUnits)} ${name}。${fmt(result.totalTerms)} 語中 ${fmt(result.terms.length)} 語を表示。語を選ぶと使用例と次の探索を表示します。`;
    renderTermTable();
  } catch (error) {
    if (run === x.run) $("termSummary").textContent = "共起語の解析に失敗しました：" + (error.message || String(error));
  } finally {
    if (run === x.run) $("termsPanel").removeAttribute("aria-busy");
  }
}

function renderTermTable() {
  const x = S.exploration, result = x.result;
  if (!result) return;
  if (!result.terms.length) {
    $("termTable").innerHTML = `<p class="term-caption">${result.nHit ? "条件に合う語がありません。最小出現数を下げてみてください。" : "現在の探索条件に一致する文がありません。前の段階に戻るか、絞り込みを変更してください。"}</p>`;
    return;
  }
  const pct = (v) => (v * 100).toFixed(1) + "%";
  $("termTable").innerHTML = `<table class="term-table"><thead><tr><th scope="col">語</th><th scope="col">出現件数</th><th scope="col">出現率</th><th scope="col">全体の出現率</th><th scope="col" title="出現率 ÷ 少数補正した全体の出現率">リフト</th></tr></thead><tbody>`
    + result.terms.map((t, i) => `<tr${x.selected === t.term ? ' class="selected"' : ""}><td><button data-term="${i}" aria-pressed="${x.selected === t.term}">${esc(t.term)}</button></td><td>${fmt(t.docs)}</td><td>${pct(t.rate)}</td><td>${pct(t.bg_rate)}</td><td>${t.lift.toFixed(2)}</td></tr>`).join("") + "</tbody></table>";
}

function renderTermContext() {
  const x = S.exploration, result = x.result, word = x.selected;
  const box = $("termContext");
  box.classList.toggle("hidden", !word || !result);
  $("termSplit").classList.toggle("has-context", !!word && !!result);
  if (!word || !result) return;
  const current = x.steps[x.steps.length - 1], terms = [...current.terms, word];
  const rows = sortHits(Int32Array.from(result.hits.filter((row) => maskExcluded(S.table.text[row], S.excl).includes(word))));
  const reports = new Set();
  if (result.isReport) for (const row of rows) reports.add(S.table.reportIds[row]);
  const count = result.isReport ? reports.size : rows.length;
  box.innerHTML = `<header><b>「${esc(word)}」の使用例</b><button class="icon-btn" data-close-context aria-label="使用例を閉じる">×</button></header>`
    + '<div class="term-actions"><button class="chip" data-explore="pivot" title="以前の検索語を外し、この語を含む文を調べます">この語を起点に探す</button><button class="chip" data-explore="narrow" title="現在の語すべてと、この語が同じ文にあるものに絞ります">現在の語との組み合わせで絞る</button></div>'
    + `<p class="term-caption">この語を含む ${fmt(count)} ${result.isReport ? "レポート" : "文"}・${fmt(rows.length)} 文。${fmt(Math.min(rows.length, x.contextLimit))} 文を表示。文章を開くと全文を表示します。</p><div class="term-examples">`
    + Array.from(rows.slice(0, x.contextLimit), (row) => {
      const text = S.table.text[row], spans = spansOf(text, terms, S.excl);
      return `<details class="term-example"><summary>${metaHtml(row)}${snippetHtml(text, spans, S.settings.context, false)}</summary>${snippetHtml(text, spans, S.settings.context, true)}</details>`;
    }).join("") + "</div>" + (rows.length > x.contextLimit ? '<button class="link" data-more-context>さらに100文を表示</button>' : "");
}

function renderView() {
  const available = !!S.table && S.terms.length > 0;
  const terms = available && S.view === "terms";
  $("viewTabs").classList.toggle("hidden", !available);
  $("termsPanel").classList.toggle("hidden", !terms);
  document.querySelector("main").classList.toggle("analysis-view", terms);
  $("results").classList.toggle("hidden", !available || terms || !S.hits.length);
  for (const button of $("viewTabs").querySelectorAll("button")) button.classList.toggle("on", button.dataset.view === S.view);
  if (terms) return renderTerms();
  else {
    S.exploration.run++;
    $("termsPanel").removeAttribute("aria-busy");
    if (available && S.hits.length) vReset(S.hits); else vReset(null);
  }
}

/* =====================================================================
 * 結果リスト（仮想スクロール: 見えている行だけを描画し、数万件でも軽く動く）
 * ===================================================================== */
const V = { hits: null, n: 0, h: null, off: null, dirty: true, els: new Map(), active: -1, open: new Set(), est: 92, raf: 0 };

function vReset(hits) {
  const sc = $("results"), sizer = $("sizer");
  V.els.clear();
  sizer.innerHTML = "";
  V.hits = hits;
  V.n = hits ? hits.length : 0;
  V.est = Math.round(5.1 * S.settings.fontSize);
  V.h = new Float64Array(V.n).fill(V.est);
  V.off = new Float64Array(V.n + 1);
  V.dirty = true;
  V.active = -1;
  V.open = new Set();
  sc.scrollTop = 0;
  vRender();
}

function vLayout() {
  let acc = 0;
  for (let i = 0; i < V.n; i++) { V.off[i] = acc; acc += V.h[i]; }
  V.off[V.n] = acc;
  V.dirty = false;
  $("sizer").style.height = acc + "px";
}

function vFind(y) { // off[i] <= y となる最大の i
  let lo = 0, hi = V.n - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (V.off[mid] <= y) lo = mid; else hi = mid - 1;
  }
  return lo;
}

function makeCard(i) {
  const row = V.hits[i];
  const el = document.createElement("article");
  el.dataset.i = i;
  fillCard(el, i, row);
  return el;
}

function fillCard(el, i, row) {
  const isOpen = V.open.has(i);
  el.className = "card" + (i === V.active ? " active" : "") + (isOpen ? " open" : "");
  const text = S.table.text[row];
  el.innerHTML = metaHtml(row) + snippetHtml(text, spansOf(text, S.terms, S.excl), S.settings.context, isOpen);
}

/** 描画した行の高さを測り、ずれていれば全体を再配置する（見えている先頭行が動かないよう補正する）。 */
function vMeasure(idxs, anchor) {
  const sc = $("results");
  let changed = false;
  for (const i of idxs) {
    const el = V.els.get(i);
    if (!el) continue;
    const h = el.offsetHeight;
    if (Math.abs(h - V.h[i]) > 0.5) { V.h[i] = h; changed = true; }
  }
  if (changed) {
    const before = V.off[anchor];
    V.dirty = true;
    vLayout();
    const delta = V.off[anchor] - before;
    if (delta && sc.scrollTop > 0) sc.scrollTop += delta;
  } else if (V.dirty) {
    vLayout();
  }
  for (const [i, el] of V.els) el.style.transform = `translateY(${V.off[i]}px)`;
}

function vRender() {
  if (!V.hits || !V.n) return;
  if (V.dirty) vLayout();
  const sc = $("results"), sizer = $("sizer");
  const top = sc.scrollTop, vh = sc.clientHeight;
  const first = vFind(top), last = vFind(top + vh);
  const s = Math.max(0, first - OVERSCAN), e = Math.min(V.n - 1, last + OVERSCAN);
  for (const [i, el] of V.els) if (i < s || i > e) { el.remove(); V.els.delete(i); }
  const added = [];
  for (let i = s; i <= e; i++) {
    if (V.els.has(i)) continue;
    const el = makeCard(i);
    V.els.set(i, el);
    sizer.appendChild(el);
    added.push(i);
  }
  vMeasure(added, first);
}

function vScrollTo(i) {
  const sc = $("results");
  if (V.dirty) vLayout();
  const a = V.off[i], b = V.off[i + 1];
  if (a < sc.scrollTop) sc.scrollTop = a;
  else if (b > sc.scrollTop + sc.clientHeight) sc.scrollTop = b - sc.clientHeight;
  vRender();
}

function vSetActive(i) {
  const prev = V.els.get(V.active);
  if (prev) prev.classList.remove("active");
  V.active = i;
  const cur = V.els.get(i);
  if (cur) cur.classList.add("active");
}

function vToggle(i) {
  if (V.open.has(i)) V.open.delete(i); else V.open.add(i);
  const el = V.els.get(i);
  if (!el) return;
  fillCard(el, i, V.hits[i]);
  vMeasure([i], vFind($("results").scrollTop));
}

function initResults() {
  const sc = $("results");
  sc.addEventListener("scroll", () => {
    if (V.raf) return;
    V.raf = requestAnimationFrame(() => { V.raf = 0; vRender(); });
  });
  window.addEventListener("resize", () => {
    if (!V.hits) return;
    vMeasure([...V.els.keys()], vFind(sc.scrollTop));
    vRender();
  });
  $("sizer").addEventListener("click", (e) => {
    const card = e.target.closest("article.card");
    if (!card) return;
    const i = Number(card.dataset.i);
    vSetActive(i);
    vToggle(i);
  });
  const focusRow = (i) => { vSetActive(i); vScrollTo(i); sc.focus({ preventScroll: true }); };
  sc.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "j") {
      e.preventDefault();
      focusRow(Math.min(V.n - 1, V.active + 1));
    } else if (e.key === "ArrowUp" || e.key === "k") {
      e.preventDefault();
      if (V.active <= 0) { vSetActive(-1); $("q").focus(); } else focusRow(V.active - 1);
    } else if ((e.key === "Enter" || e.key === " ") && V.active >= 0) {
      e.preventDefault();
      vToggle(V.active);
    } else if (e.key === "Escape") {
      vSetActive(-1);
      $("q").focus();
    }
  });
  V.focusFirst = () => focusRow(0);
}

/* =====================================================================
 * 画面の更新
 * ===================================================================== */
function renderStatus() {
  let body;
  if (S.error) body = `<span class="error">${esc(S.error)}</span>`;
  else if (S.loadingText) body = `<span class="muted">${esc(S.loadingText)}</span>`;
  else if (!S.table) body = '<span class="muted">Excel（.xlsx）または CSV を開くと検索できます。</span>';
  else if (!S.hits) body = `<span class="muted"><b class="num">${fmt(S.pool)}</b> 行が対象（全 ${fmt(S.table.n)} 行）</span>`;
  else {
    const m = MODES.find((x) => x.id === effectiveMode());
    const pill = S.terms.length === 2 && m ? `<span class="pill">${esc(m.label)}</span>` : "";
    const hint = S.hits.length && S.view === "results" ? '<span class="spacer"></span><span class="hint"><kbd>↓</kbd> 結果へ <kbd>Enter</kbd> 全文 <kbd>Esc</kbd> 検索欄へ</span>' : "";
    body = (S.view === "terms" ? '<span class="muted">検索欄の一致：</span>' : "")
      + `<b class="num big">${fmt(S.hits.length)}</b><span class="muted"> 件 / ${fmt(S.pool)} 行</span>${pill}${hint}`
      + (S.hits.length === 0 && S.view === "results" ? '<span class="muted"> — 完全一致する句は見つかりませんでした</span>' : "");
  }
  $("status").innerHTML = body;
}

function renderModeSeg() {
  const eff = effectiveMode();
  const modes = MODES.filter((m) => m.id !== "report" || (S.table && S.table.reportIds));
  $("modeSeg").innerHTML = modes.map((m) => `<button role="radio" aria-checked="${eff === m.id}" class="${eff === m.id ? "on" : ""}" data-mode="${m.id}" title="${esc(m.hint)}">${esc(m.label)}</button>`).join("");
}

function renderRecent() {
  const box = $("recent");
  if (!S.table || S.terms.length) { box.innerHTML = ""; return; }
  if (!S.recent.length) {
    box.innerHTML = '<div class="empty"><p>フレーズを入力すると、その場で完全一致の結果が出ます。</p><p class="muted"><kbd>/</kbd> 検索欄へ · <kbd>↓</kbd> 結果へ · <kbd>Enter</kbd> 全文 · <kbd>Esc</kbd> クリア</p></div>';
    return;
  }
  const ago = (t) => {
    const s = (Date.now() - t) / 1000;
    if (s < 60) return "たった今";
    if (s < 3600) return `${Math.floor(s / 60)}分前`;
    if (s < 86400) return `${Math.floor(s / 3600)}時間前`;
    const d = new Date(t);
    return `${d.getMonth() + 1}/${d.getDate()}`;
  };
  const items = S.recent.slice(0, RECENT_SHOWN).map((r, i) => `<li>
      <button class="recent-item" data-pick="${i}"><span class="recent-q">${esc(r.q)}${r.q2 ? `<span class="muted"> ＋ </span>${esc(r.q2)}` : ""}${r.excl ? `<span class="muted"> − ${esc(r.excl)}</span>` : ""}</span><span class="recent-meta">${fmt(r.hits)} 件 · ${ago(r.at)}</span></button>
      <button class="icon-btn faint" data-del="${i}" aria-label="この履歴を削除">×</button></li>`).join("");
  box.innerHTML = `<section class="recent"><div class="recent-head"><span>最近の検索</span><button class="link" id="clearRecent">履歴を消去</button></div><ul>${items}</ul></section>`;
}

let recordTimer = null;
function scheduleRecord() {
  clearTimeout(recordTimer);
  const q = $("q").value, q2 = $("q2").value, excl = $("excl").value, mode = S.mode;
  if (!S.hits || !q) return;
  const hits = S.hits.length, dataset = S.files.map((f) => f.name).join(" ＋ ");
  recordTimer = setTimeout(() => {
    const entry = { q, q2, mode, excl, hits, at: Date.now(), dataset };
    let rest = S.recent.filter((r) => !(r.q === q && r.q2 === q2 && r.excl === excl && r.mode === mode));
    const top = rest[0];
    if (top && Date.now() - top.at < 15000 && top.q2 === q2 && (q.startsWith(top.q) || top.q.startsWith(q))) rest = rest.slice(1);
    S.recent = [entry, ...rest].slice(0, RECENT_MAX);
    persistSet("ps.recent", S.recent);
    if (!S.terms.length) renderRecent();
  }, 1200);
}

function refresh() {
  if (!S.table) { renderStatus(); return; }
  const q = $("q").value, q2 = $("q2").value;
  S.terms = [q, q2].filter(Boolean);
  S.excl = sortExcl($("excl").value.split(/\s+/));
  $("clearQ").classList.toggle("hidden", !q);
  // 文の一覧の並び（年の新しい順 → 格付 → 業種）
  S.hits = S.terms.length ? sortHits(findHits(S.terms, effectiveMode(), S.excl)) : null;
  renderStatus();
  syncExploration();
  renderView();
  renderRecent();
  scheduleRecord();
}

/* =====================================================================
 * データの読み込み
 * ===================================================================== */
function notice(kind, html) {
  const d = document.createElement("div");
  d.className = "notice " + kind;
  d.innerHTML = html;
  $("notices").appendChild(d);
}

/** S.files をつないで表を作り直す。extra はデータ名の横に出す補足。 */
function setFiles(files, extra) {
  S.files = files;
  S.datasetVersion++;
  if (!files.length) {
    S.table = null;
    S.hits = null;
    S.mask = null;
    S.pool = 0;
    S.sources = [];
    $("dataLabel").textContent = "";
    $("fileList").classList.add("hidden");
    $("addBtn").classList.add("hidden");
    $("searchBox").classList.add("hidden");
    $("results").classList.add("hidden");
    $("recent").innerHTML = "";
    $("notices").innerHTML = "";
    $("dropzone").classList.remove("hidden");
    renderView();
    renderStatus();
    return;
  }
  const { cols, sources } = mergeFiles(files);
  S.sources = sources;
  S.table = buildTable(cols);
  S.error = "";
  S.loadingText = "";
  $("notices").innerHTML = "";
  for (const f of files) {
    const missing = EXPECTED_COLUMNS.filter((c) => !f.cols[c]);
    if (missing.length) notice("", (files.length > 1 ? esc(f.name) + ": " : "") + "次の列がファイルにありません（該当する表示・絞り込みは省略されます）: " + esc(missing.join(", ")));
  }
  changeNotice();
  $("dropzone").classList.add("hidden");
  $("searchBox").classList.remove("hidden");
  $("addBtn").classList.remove("hidden");
  const name = files.length > 1 ? `${files.length} ファイル` : files[0].name;
  const dropped = sources.reduce((a, x) => a + x.dropped, 0);
  $("dataLabel").textContent = `${name} · ${fmt(S.table.n)} 行${dropped ? `（重複 ${fmt(dropped)} 行を除外）` : ""}${extra ? " · " + extra : ""}`;
  renderFileList();
  buildFilterUi();
  renderModeSeg();
  refresh();
}

function renderFileList() {
  const el = $("fileList");
  el.classList.toggle("hidden", S.files.length < 2);
  if (S.files.length < 2) { el.innerHTML = ""; return; }
  el.innerHTML = S.sources.map((x, i) =>
    `<span class="file"><b>${esc(x.name)}</b> ${fmt(x.rows)} 行${x.dropped ? `（重複 ${fmt(x.dropped)} 行を除外）` : ""}` +
    `<button class="icon-btn faint" data-remove="${i}" aria-label="${esc(x.name)} を外す" title="このファイルを外す">×</button></span>`,
  ).join("");
}

async function saveFiles() {
  try {
    await idbPut(DB_KEY_FILES, { v: CACHE_VERSION, files: S.files });
  } catch (e) {
    notice("", "データをこのブラウザに保存できませんでした。次回も、もう一度ファイルを選択してください。");
  }
}

async function parseFile(file, onProgress) {
  const lower = file.name.toLowerCase();
  let cols;
  if (/\.(xlsx|xlsm)$/.test(lower)) cols = await parseXlsx(file, onProgress);
  else if (/\.csv$/.test(lower)) cols = await parseCsvFile(file, onProgress);
  else if (/\.xls$/.test(lower)) throw new Error("古い形式（.xls）には対応していません。Excel で「.xlsx 形式」で保存し直してください。");
  else throw new Error("Excel（.xlsx）または CSV ファイルを選択してください。");
  if (!cols[TEXT_COLUMN]) throw new Error(`「${TEXT_COLUMN}」列が見つかりません。次の列を持つファイルを指定してください: ${EXPECTED_COLUMNS.join(", ")}`);
  if (cols[TEXT_COLUMN].length === 0) throw new Error("ファイルにデータがありません。");
  return cols;
}

/** ファイルを読み込む。add=true なら今のデータに加え（同じ名前のファイルは新しい内容に置き換え）、false なら置き換える。 */
async function loadFiles(fileList, add) {
  const list = [...fileList];
  if (!list.length) return;
  S.error = "";
  $("progress").classList.remove("hidden");
  const files = add ? [...S.files] : [];
  try {
    for (const file of list) {
      const label = list.length > 1 ? `${file.name} を読み込み中…` : "読み込み中…";
      S.loadingText = label;
      renderStatus();
      const cols = await parseFile(file, (rows) => { S.loadingText = `${label} ${fmt(rows)} 行`; renderStatus(); });
      const entry = { name: file.name, savedAt: Date.now(), cols };
      const at = files.findIndex((f) => f.name === file.name);
      if (at >= 0) files[at] = entry; else files.push(entry);
    }
    setFiles(files, "読み込み " + new Date().toLocaleString("ja-JP"));
    await saveFiles();
  } catch (e) {
    S.loadingText = "";
    S.error = e.message || String(e);
    if (!S.table) $("dropzone").classList.remove("hidden");
    renderStatus();
  } finally {
    $("progress").classList.add("hidden");
  }
}

async function loadCached() {
  try {
    const rec = await idbGet(DB_KEY_FILES);
    if (rec && rec.v === CACHE_VERSION && rec.files && rec.files.length && rec.files.every((f) => f.cols && f.cols[TEXT_COLUMN])) {
      const last = Math.max(...rec.files.map((f) => f.savedAt));
      setFiles(rec.files, "前回読み込み " + new Date(last).toLocaleString("ja-JP") + "（このブラウザに保存済み）");
      return true;
    }
    const old = await idbGet(DB_KEY_LEGACY);  // 以前の版で保存した 1 ファイル
    if (old && old.v === CACHE_VERSION && old.cols && old.cols[TEXT_COLUMN]) {
      setFiles([{ name: old.name, savedAt: old.savedAt, cols: old.cols }],
        "前回読み込み " + new Date(old.savedAt).toLocaleString("ja-JP") + "（このブラウザに保存済み）");
      return true;
    }
  } catch (e) { /* キャッシュが使えない環境では何もしない */ }
  return false;
}

/* =====================================================================
 * 表示設定・イベント
 * ===================================================================== */
function applySettings() {
  const st = S.settings;
  const root = document.documentElement;
  root.style.setProperty("--font-size", st.fontSize + "px");
  root.style.setProperty("--font", st.font === "system-ui" ? "system-ui" : `"${st.font}"`);
  if (st.theme === "auto") delete root.dataset.theme; else root.dataset.theme = st.theme;
  $("fontSizeVal").textContent = st.fontSize + "px";
  $("contextVal").textContent = st.context;
  $("fontSize").value = st.fontSize;
  $("context").value = st.context;
  $("fontSel").value = st.font;
  document.querySelectorAll("#themeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.theme === st.theme));
}

function updateSettings(patch, rerender) {
  S.settings = { ...S.settings, ...patch };
  persistSet("ps.settings", S.settings);
  applySettings();
  if (rerender && S.table) refresh();
}

function showSecond(on) {
  $("secondRow").classList.toggle("hidden", !on);
  $("addSecond").classList.toggle("hidden", on);
  if (on) $("q2").focus();
}
function showExcl(on) {
  $("exclRow").classList.toggle("hidden", !on);
  $("addExcl").classList.toggle("hidden", on);
  if (on) $("excl").focus();
}

function initUi() {
  // 設定
  $("fontSel").innerHTML = FONTS.map((f) => `<option value="${esc(f)}">${f === "system-ui" ? "端末の標準フォント" : esc(f)}</option>`).join("");
  if (!FONTS.includes(S.settings.font)) S.settings.font = DEFAULT_SETTINGS.font;
  applySettings();
  $("settingsBtn").addEventListener("click", () => togglePop($("settingsAnchor")));
  $("fontSize").addEventListener("input", (e) => updateSettings({ fontSize: Number(e.target.value) }, true));
  $("context").addEventListener("input", (e) => updateSettings({ context: Number(e.target.value) }, true));
  $("fontSel").addEventListener("change", (e) => updateSettings({ font: e.target.value }, true));
  $("themeSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) updateSettings({ theme: b.dataset.theme }, false); });

  // 共起語と段階的な探索（検索欄の語は変更せず、年・格付などの絞り込みを維持）
  $("viewTabs").addEventListener("click", (e) => {
    const button = e.target.closest("button[data-view]");
    if (!button) return;
    S.view = button.dataset.view;
    persistSet("ps.html.view", S.view);
    renderStatus();
    renderView();
  });
  for (const id of ["termUnit", "termRank", "termMin", "termTop"]) {
    $(id).addEventListener("change", () => {
      S.termSettings = normalizeTermSettings({ unit: $("termUnit").value, rankBy: $("termRank").value,
        minCount: $("termMin").value, topN: $("termTop").value });
      persistSet("ps.html.terms", S.termSettings);
      renderTerms();
    });
  }
  $("termTrail").addEventListener("click", (e) => {
    const button = e.target.closest("button[data-step]");
    if (button) goToTermStep(Number(button.dataset.step));
  });
  $("termBack").addEventListener("click", () => goToTermStep(S.exploration.steps.length - 2));
  $("termReset").addEventListener("click", () => goToTermStep(0));
  $("termTable").addEventListener("click", (e) => {
    const button = e.target.closest("button[data-term]"), result = S.exploration.result;
    if (!button || !result) return;
    const term = result.terms[Number(button.dataset.term)];
    if (!term) return;
    S.exploration.selected = term.term;
    S.exploration.contextLimit = 100;
    renderTermTable();
    renderTermContext();
  });
  $("termContext").addEventListener("click", (e) => {
    const button = e.target.closest("button");
    if (!button) return;
    if (button.dataset.explore) exploreTerm(S.exploration.selected, button.dataset.explore);
    else if (button.hasAttribute("data-close-context")) { S.exploration.selected = ""; renderTermTable(); renderTermContext(); }
    else if (button.hasAttribute("data-more-context")) { S.exploration.contextLimit += 100; renderTermContext(); }
  });

  // 検索欄
  let timer = null;
  const schedule = () => { clearTimeout(timer); timer = setTimeout(refresh, 40); };
  for (const id of ["q", "q2", "excl"]) {
    const el = $(id);
    el.addEventListener("compositionstart", () => { S.composing = true; });
    el.addEventListener("compositionend", () => { S.composing = false; schedule(); });
    el.addEventListener("input", (e) => { if (!e.isComposing && !S.composing) schedule(); else $("clearQ").classList.toggle("hidden", !$("q").value); });
  }
  $("q").addEventListener("keydown", (e) => {
    if (e.isComposing) return;
    if (e.key === "Escape") {
      if ($("q").value) { $("q").value = ""; refresh(); } else e.currentTarget.blur();
    } else if (e.key === "ArrowDown" && S.view === "results" && S.hits && S.hits.length) {
      e.preventDefault();
      V.focusFirst();
    }
  });
  $("clearQ").addEventListener("click", () => { $("q").value = ""; refresh(); $("q").focus(); });
  $("addSecond").addEventListener("click", () => showSecond(true));
  $("addExcl").addEventListener("click", () => showExcl(true));
  $("removeSecond").addEventListener("click", () => { $("q2").value = ""; showSecond(false); refresh(); $("q").focus(); });
  $("removeExcl").addEventListener("click", () => { $("excl").value = ""; showExcl(false); refresh(); $("q").focus(); });
  $("q2").addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || e.isComposing) return;
    if ($("q2").value) { $("q2").value = ""; refresh(); } else { showSecond(false); $("q").focus(); }
  });
  $("excl").addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || e.isComposing) return;
    if ($("excl").value) { $("excl").value = ""; refresh(); } else { showExcl(false); $("q").focus(); }
  });
  $("modeSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-mode]");
    if (!b) return;
    S.mode = b.dataset.mode;
    persistSet("ps.mode", S.mode);
    renderModeSeg();
    refresh();
  });
  $("clearFilters").addEventListener("click", () => {
    S.filters.year = null;
    for (const k of Object.keys(S.filters.sel)) S.filters.sel[k].clear();
    filtersChanged();
  });

  // 最近の検索
  $("recent").addEventListener("click", (e) => {
    const pick = e.target.closest("[data-pick]");
    const del = e.target.closest("[data-del]");
    if (e.target.closest("#clearRecent")) {
      S.recent = []; persistSet("ps.recent", S.recent); renderRecent();
    } else if (del) {
      S.recent.splice(Number(del.dataset.del), 1); persistSet("ps.recent", S.recent); renderRecent();
    } else if (pick) {
      const r = S.recent[Number(pick.dataset.pick)];
      $("q").value = r.q; $("q2").value = r.q2; $("excl").value = r.excl;
      S.mode = r.mode; persistSet("ps.mode", S.mode);
      showSecond(!!r.q2); showExcl(!!r.excl);
      renderModeSeg();
      refresh();
      $("q").focus();
    }
  });

  // キーボード: / または ⌘K で検索欄へ
  window.addEventListener("keydown", (e) => {
    const typing = e.target.closest && e.target.closest("input, textarea, select");
    if ((e.key === "/" && !typing) || (e.key === "k" && (e.metaKey || e.ctrlKey))) {
      if (!S.table) return;
      e.preventDefault();
      $("q").focus();
      $("q").select();
    }
  });

  // ファイルの読み込み
  //   「ファイルを開く」は今のデータを置き換え、「＋ ファイルを追加」とドロップは今のデータに加える
  const input = $("fileInput");
  let addMode = false;
  const pick = (add) => { addMode = add; input.click(); };
  $("dropzone").addEventListener("click", () => pick(false));
  $("dropzone").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(false); } });
  $("openBtn").addEventListener("click", () => pick(false));
  $("addBtn").addEventListener("click", () => pick(true));
  input.addEventListener("change", () => {
    const files = [...input.files];
    input.value = "";
    loadFiles(files, addMode);
  });
  $("fileList").addEventListener("click", (e) => {
    const b = e.target.closest("[data-remove]");
    if (!b) return;
    setFiles(S.files.filter((_, i) => i !== Number(b.dataset.remove)));
    saveFiles();
  });
  let depth = 0;
  window.addEventListener("dragenter", (e) => { e.preventDefault(); depth++; $("dropzone").classList.add("over"); });
  window.addEventListener("dragleave", () => { depth = Math.max(0, depth - 1); if (!depth) $("dropzone").classList.remove("over"); });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    depth = 0;
    $("dropzone").classList.remove("over");
    if (e.dataTransfer && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files, !!S.table);
  });

  initResults();
}

(async function main() {
  initUi();
  renderStatus();
  S.loadingText = "保存済みのデータを確認中…";
  renderStatus();
  const ok = await loadCached();
  S.loadingText = "";
  if (!ok) renderStatus();
  else $("q").focus();
})();
</script>
